    <script>
      // Strict on-demand loader for html2pdf (zero network fetch on Welcome/Login boot)
      window.loadHtml2PdfOnDemand = function() {
        if (typeof window.html2pdf === 'function') {
          return Promise.resolve(window.html2pdf);
        }
        if (window.__html2pdfLoadPromise) {
          return window.__html2pdfLoadPromise;
        }
        window.__html2pdfLoadPromise = new Promise(function(resolve) {
          var s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
          s.integrity = 'sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==';
          s.crossOrigin = 'anonymous';
          s.async = true;
          s.onload = function() {
            resolve(typeof window.html2pdf === 'function' ? window.html2pdf : null);
          };
          s.onerror = function() {
            window.__html2pdfLoadPromise = null;
            resolve(null);
          };
          document.head.appendChild(s);
        });
        return window.__html2pdfLoadPromise;
      };
    </script>
